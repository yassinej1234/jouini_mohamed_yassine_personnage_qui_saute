<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Runner Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

  <!-- BACKGROUND -->
  <div id="background"></div>

  <!-- SCORE HUD -->
  <div id="hud">
    <span>SCORE</span>
    <h1 id="score">0</h1>
  </div>

  <!-- PLAYER -->
  <div id="player">
    <img id="playerImg" src="run.png">
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <p id="finalScore">Score : 0</p>
    <button id="restart">Rejouer</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
